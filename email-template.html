<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CapitalNest Password Reset</title>
</head>
<body style="margin:0; padding:0; background:#f3f4f6; font-family:Arial, Helvetica, sans-serif; color:#111827;">
    <div style="max-width:640px; margin:0 auto; background:#ffffff; border-radius:12px; overflow:hidden; border:1px solid #e5e7eb;">
        <div style="padding:24px 28px; background:#0f172a; text-align:center;">
            <img src="https://your-domain.com/assets/img/capitalnest.png" alt="CapitalNest logo" style="max-width:180px; height:auto; display:block; margin:0 auto;">
        </div>

        <div style="padding:32px 28px;">
            <h2 style="margin:0 0 16px; font-size:28px; color:#111827;">Reset Your Password</h2>
            <p style="margin:0 0 20px; font-size:16px; line-height:1.7; color:#374151;">
                Hello,
            </p>
            <p style="margin:0 0 20px; font-size:16px; line-height:1.7; color:#374151;">
                We received a request to reset your password for CapitalNest Nepal. Click the button below to choose a new password.
            </p>

            <div style="text-align:center; margin:28px 0;">
                <a href="{{ .ConfirmationURL }}" style="display:inline-block; background:#0ea5a5; color:#ffffff; text-decoration:none; padding:14px 28px; border-radius:10px; font-weight:700;">
                    Reset Password
                </a>
            </div>

            <p style="margin:0 0 12px; font-size:14px; line-height:1.7; color:#4b5563;">
                If you did not request this, you can safely ignore this email.
            </p>
        </div>

        <div style="padding:20px 28px; background:#f8fafc; border-top:1px solid #e5e7eb; font-size:12px; color:#6b7280; text-align:center;">
            © 2026 CapitalNest Nepal
        </div>
    </div>
</body>
</html>
