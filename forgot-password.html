<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | CapitalNest Nepal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1a1d2d 100%);
            font-family: Arial, Helvetica, sans-serif;
            color: #1f2937;
        }

        .auth-shell {
            width: min(100%, 460px);
            background: rgba(255,255,255,0.96);
            border: 1px solid rgba(148, 163, 184, 0.28);
            border-radius: 18px;
            box-shadow: 0 22px 55px rgba(15, 23, 42, 0.18);
            padding: 28px 26px 22px;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 18px;
            padding: 4px 0 12px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.22);
        }

        .brand-mark {
            width: 160px;
            height: auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .brand-mark img {
            width: 100%;
            height: auto;
            object-fit: contain;
            display: block;
        }

        .auth-title {
            text-align: center;
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #111827;
        }

        .field-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        .input-box {
            position: relative;
        }

        .input-box input {
            width: 100%;
            height: 48px;
            border-radius: 12px;
            border: 1px solid #d1d5db;
            background: #fff;
            padding: 0 16px;
            font-size: 14px;
            color: #111827;
            outline: none;
        }

        .input-box input::placeholder {
            color: #9ca3af;
        }

        .reset-btn {
            width: 100%;
            height: 52px;
            border-radius: 14px;
            border: 1px solid #3bc6c3;
            background: #101827;
            color: rgba(255,255,255,0.8);
            font-weight: 700;
            letter-spacing: 0.4px;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
            margin-top: 8px;
        }

        .reset-btn::before,
        .reset-btn::after {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            width: 18px;
            background: transparent;
            border-top: 1px solid rgba(27, 214, 190, 0.9);
            border-bottom: 1px solid rgba(27, 214, 190, 0.9);
        }

        .reset-btn::before {
            left: 0;
            border-left: 1px solid rgba(27, 214, 190, 0.9);
        }

        .reset-btn::after {
            right: 0;
            border-right: 1px solid rgba(245, 129, 19, 0.9);
        }

        .reset-btn span {
            position: relative;
            z-index: 1;
        }

        .message {
            display: none;
            margin-top: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.5;
        }

        .message.error {
            display: block;
            background: rgba(220, 38, 38, 0.08);
            color: #b91c1c;
            border: 1px solid rgba(220, 38, 38, 0.18);
        }

        .message.success {
            display: block;
            background: rgba(16, 185, 129, 0.08);
            color: #047857;
            border: 1px solid rgba(16, 185, 129, 0.18);
        }

        .bottom-text {
            text-align: center;
            font-size: 14px;
            color: #4b5563;
            margin-top: 12px;
        }

        .bottom-text a {
            color: #0ea5a5;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="auth-shell">
        <div class="brand">
            <span class="brand-mark">
                <img src="assets/img/capitalnest.png" alt="CapitalNest logo">
            </span>
        </div>

        <div class="auth-title">Forgot Password</div>

        <form id="forgotPasswordForm">
            <div>
                <label class="field-label" for="email">Email address</label>
                <div class="input-box">
                    <input id="email" type="email" placeholder="Please enter your email address" required>
                </div>
            </div>

            <button class="reset-btn" type="submit"><span>Send Reset Link</span></button>
            <div id="forgotMessage" class="message" aria-live="polite"></div>
        </form>

        <div class="bottom-text">
            <a href="login.html">Back to login</a>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const supabaseUrl = 'https://mohigobcssqzywmhndml.supabase.co';
        const supabaseAnonKey = 'sb_publishable_MRVoyKc48ERptjd1G9l08g_3YTAleje';
        const supabase = createClient(supabaseUrl, supabaseAnonKey);

        const form = document.getElementById('forgotPasswordForm');
        const message = document.getElementById('forgotMessage');

        function showMessage(type, text) {
            message.className = 'message ' + type;
            message.textContent = text;
        }

        form.addEventListener('submit', async function (event) {
            event.preventDefault();

            if (!supabaseUrl || supabaseUrl.includes('PASTE_') || !supabaseAnonKey || supabaseAnonKey.includes('PASTE_')) {
                showMessage('error', 'Please add your Supabase URL and anon key before using forgot password.');
                return;
            }

            const email = document.getElementById('email').value.trim();
            if (!email) {
                showMessage('error', 'Please enter your email address.');
                return;
            }

            try {
                const { error } = await supabase.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/reset-password.html'
                });

                if (error) {
                    showMessage('error', error.message || 'Unable to send reset email.');
                    return;
                }

                showMessage('success', 'Password reset email sent successfully. Please check your inbox.');
                form.reset();
            } catch (error) {
                showMessage('error', 'Something went wrong while sending the reset email.');
            }
        });
    </script>
</body>
</html>
